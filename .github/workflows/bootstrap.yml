# One-time setup of everything that lives on Supabase and on Bale. Safe to run again.
#   1. applies the database migrations
#   2. stores the Bale token as a Supabase secret (the only secret the functions need)
#   3. deploys the two Edge Functions
#   4. points the Bale webhook at the secret path derived from the bot token
#   5. starts the GitHub Pages deployment
# It does not start the worker. That waits for the Telegram login, which scripts/setup.py runs next.
# Normally started by scripts/setup.py. It can also be started by hand: Actions → bootstrap → Run workflow.

name: bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write # starts the Pages deployment

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply database migrations
        # `echo y` answers the CLI's confirmation prompt. Migrations already applied are skipped.
        run: echo y | supabase db push

      - name: Store the Bale token and the page address for the Edge Functions
        # The page address is the GitHub Pages address of this repository. The bot's button opens it.
        run: |
          supabase secrets set "BALE_BOT_TOKEN=$BALE_BOT_TOKEN" "MINI_APP_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

      - name: Deploy the Edge Functions
        run: |
          supabase functions deploy api --no-verify-jwt
          supabase functions deploy bale-webhook --no-verify-jwt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Register the Bale webhook
        working-directory: worker
        run: |
          pip install -q -r requirements.txt
          python -m bale_viewer_worker register-webhook

      - name: Start the web page deployment
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY"
