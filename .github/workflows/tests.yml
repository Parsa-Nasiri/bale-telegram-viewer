# Runs on every push and pull request. No secrets are needed: the tests use in-memory fakes only.

name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    name: worker (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: worker

      - name: Run unit tests
        run: python -m unittest discover -s tests -t .
        working-directory: worker

  node:
    name: frontend and Edge Functions (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Node 22.18+ runs .ts files directly (type stripping is on by default), so no build step is needed.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Edge Function tests
        run: node --test "supabase/functions/tests/*.test.ts"

      - name: Frontend tests
        run: node --test "tests/*.test.js"
        working-directory: frontend
